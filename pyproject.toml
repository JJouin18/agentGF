[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgf"
version = "0.3.0"
description = "Agent IA de gestion de budget et d'épargne, propulsé par Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentgf = "agentgf.cli:main"

[tool.setuptools]
packages = ["agentgf"]

[tool.setuptools.package-data]
agentgf = ["static/*.html"]
